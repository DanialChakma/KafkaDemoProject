#version: '3.9'

services:
  # ---------------------------
  # Spring Boot Application
  # ---------------------------
  app:
#    image: order-service:aot-cds
    image: order-service
    build: .
#    dockerfile: DockerfileBackupNative
    container_name: order-service
    ports:
      - "8086:8086"
#    volumes:
#      - app-cds-volume:/app/app-cds.jsa:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mariadb:3306/order_db?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: danial
      SPRING_DATASOURCE_PASSWORD: nopass
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      # Optional: profiles or other settings
      SPRING_PROFILES_ACTIVE: mdev
      JAVA_OPTS: "-XX:+UseContainerSupport -Xms32m -Xmx64m -XX:MaxMetaspaceSize=128m -XX:+UseG1GC -XX:+AlwaysPreTouch -Xshare:on -XX:SharedArchiveFile=/app/app-cds.jsa"
#      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
    mem_limit: 272m   # Docker hard limit

    networks:
      - shared-net

# ---------------------------
# Docker Volumes & Network
# ---------------------------
volumes:
#  app-cds-volume:
#    driver: local
  mysql_data:

networks:
  shared-net:
    external: true
